# AgriVision AI — Render Blueprint (Docker deploy)
# Use this with Render's "New + → Blueprint" flow, or push it to the repo
# root and link the repo — Render auto-creates/updates the service.
#
# A Docker service ignores runtime.txt and the native Python version
# entirely; the image's declared Python (python:3.12-slim) is what runs.

services:
  - type: web
    name: agrivision
    runtime: docker
    repo: https://github.com/MadukaJP/agrivision-deep-learning-project
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000